<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS đi chợ</title>
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      #container {
        width: 400px;
        margin: 50px auto;
      }

      input {
        padding: 8px;
      }

      button {
        padding: 8px 15px;
        cursor: pointer;
      }

      li {
        margin: 10px 0;
        cursor: pointer;
      }

      .mua {
        text-decoration: line-through;
        color: gray;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <form id="form">
        <label for="name">Tên món:</label>
        <input type="text" id="name" placeholder="Nhập tên món" required />
        <br />
        <br />
        <button type="submit">Thêm món</button>
      </form>
      <p id="soluong">Mua 0/0 món</p>
      <ul id="list"></ul>
    </div>

    <script>
      const form = document.getElementById("form");
      const onhap = document.getElementById("name");
      const list = document.getElementById("list");
      const soluong = document.getElementById("soluong");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = onhap.value.trim();
        if (name === "") return;
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = name;
        li.append(span);
        list.append(li);
        onhap.value = "";
        onhap.focus();

        li.addEventListener("click", () => {
          li.classList.toggle("mua");
          update();
        });

        li.addEventListener("dblclick", () => {
          li.remove();
          update();
        });
      });

      function update() {
        const tong = list.children.length;
        const daMua = list.querySelectorAll(".mua").length;
        const chuaMua = tong - daMua
        soluong.textContent = `Số món chưa mua là: ${chuaMua}/${tong} món`;
      }
    </script>
  </body>
</html>
